<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>VeriDS Extension</title>
  <style>
    :root {
      --color-bg: #FAF9F6;
      --color-surface: #FFFFFF;
      --color-border: #E2E8F0;
      --color-text: #0F172A;
      --color-text-muted: #475569;
      --color-primary: #059669;
      --color-primary-light: rgba(5, 150, 105, 0.1);
      --font-family: 'Inter', -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    body {
      width: 340px;
      padding: 16px;
      font-family: var(--font-family);
      background-color: var(--color-bg);
      color: var(--color-text);
    }

    .header {
      display: flex;
      align-items: center;
      gap: 8px;
      margin-bottom: 16px;
      padding-bottom: 12px;
      border-bottom: 1px solid var(--color-border);
    }

    .header-logo {
      width: 24px;
      height: 24px;
      border-radius: 4px;
    }

    .header-title {
      font-size: 1rem;
      font-weight: 700;
      color: var(--color-primary);
    }

    .card {
      background-color: var(--color-surface);
      border: 1px solid var(--color-border);
      border-radius: 10px;
      padding: 12px;
      margin-bottom: 12px;
      box-shadow: 0 1px 3px rgba(15, 23, 42, 0.05);
    }

    .btn {
      width: 100%;
      padding: 10px;
      border-radius: 6px;
      background-color: var(--color-primary);
      color: #FFFFFF;
      border: none;
      font-weight: 600;
      font-size: 0.875rem;
      cursor: pointer;
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 6px;
      transition: background-color 150ms ease;
    }

    .btn:hover {
      background-color: #047857;
    }

    .btn-secondary {
      background-color: #F1F5F9;
      color: var(--color-text);
      border: 1px solid var(--color-border);
      margin-top: 8px;
    }

    .btn-secondary:hover {
      background-color: #E2E8F0;
    }

    .input-field {
      width: 100%;
      padding: 8px;
      border: 1px solid var(--color-border);
      border-radius: 6px;
      font-size: 0.8125rem;
      resize: vertical;
      margin-bottom: 8px;
    }

    .result-view {
      display: none;
      text-align: center;
    }

    .result-view.active {
      display: block;
    }

    .verdict-tag {
      display: inline-block;
      padding: 4px 10px;
      border-radius: 9999px;
      font-size: 0.75rem;
      font-weight: 700;
      text-transform: uppercase;
      margin-bottom: 8px;
    }

    .verdict-tag.likely-accurate { background: rgba(5, 150, 105, 0.15); color: #059669; }
    .verdict-tag.mixed { background: rgba(217, 119, 6, 0.15); color: #D97706; }
    .verdict-tag.likely-false { background: rgba(225, 29, 72, 0.15); color: #E11D48; }

    .score-num {
      font-size: 2rem;
      font-weight: 700;
      color: var(--color-text);
    }

    .explanation-text {
      font-size: 0.8125rem;
      color: var(--color-text-muted);
      margin-top: 6px;
      line-height: 1.4;
      text-align: left;
    }

    .status-msg {
      display: none;
      font-size: 0.8125rem;
      color: var(--color-text-muted);
      text-align: center;
      padding: 12px 0;
    }
  </style>
</head>
<body>
  <div class="header">
    <img src="../public/logo.jpg" alt="Logo" class="header-logo" />
    <span class="header-title">VeriDS Intelligence</span>
  </div>

  <div class="card">
    <button id="verifyCurrentTabBtn" class="btn">
      <span>Verify Active Web Page</span>
    </button>
  </div>

  <div class="card">
    <textarea id="quickTextInput" class="input-field" rows="3" placeholder="Or paste claim or headline here..."></textarea>
    <button id="verifyTextBtn" class="btn btn-secondary">Analyze Quick Text</button>
  </div>

  <div id="statusMsg" class="status-msg">Connecting to VeriDS Engine...</div>

  <div id="resultView" class="card result-view">
    <div id="verdictTag" class="verdict-tag likely-accurate">Likely Accurate</div>
    <div id="scoreNum" class="score-num">85%</div>
    <p id="explanationText" class="explanation-text"></p>
  </div>

  <script src="popup.js"></script>
</body>
</html>
